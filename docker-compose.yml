services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_pagamentos}
      POSTGRES_USER: ${POSTGRES_USER:-gestao_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./gestao-pagamentos-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gestao_pagamentos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gestao_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gestao_app_dev}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_GENERATE_KEY_PAIR: ${JWT_GENERATE_KEY_PAIR:-false}
      JWT_ISSUER: ${JWT_ISSUER:-gestao-pagamentos-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gestao-pagamentos-api}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-PT1H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      ADMIN_INITIAL_ENABLED: ${ADMIN_INITIAL_ENABLED:-false}
      ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME:-Administrador}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      TEST_ADMIN_ENDPOINT_ENABLED: ${TEST_ADMIN_ENDPOINT_ENABLED:-true}
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
