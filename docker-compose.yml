services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_pagamentos}
      POSTGRES_USER: ${POSTGRES_USER:-gestao_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestao_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./gestao-pagamentos-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gestao_pagamentos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gestao_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gestao_app_dev}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
