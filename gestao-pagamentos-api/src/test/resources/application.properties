spring.datasource.url=jdbc:h2:mem:gestao_pagamentos_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.jwt.generate-key-pair=true
app.security.jwt.issuer=gestao-pagamentos-api
app.security.jwt.audience=gestao-pagamentos-api
app.security.jwt.access-token-expiration=PT1H
app.cors.allowed-origins=http://localhost:4200
app.bootstrap.admin.enabled=false
app.test-admin.enabled=true
