spring.application.name=gestao-pagamentos-api

spring.jpa.open-in-view=false

app.security.jwt.issuer=${JWT_ISSUER:gestao-pagamentos-api}
app.security.jwt.audience=${JWT_AUDIENCE:gestao-pagamentos-api}
app.security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:PT1H}
app.security.jwt.public-key=${JWT_PUBLIC_KEY:}
app.security.jwt.private-key=${JWT_PRIVATE_KEY:}
app.security.jwt.generate-key-pair=${JWT_GENERATE_KEY_PAIR:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

app.bootstrap.admin.enabled=${ADMIN_INITIAL_ENABLED:false}
app.bootstrap.admin.name=${ADMIN_INITIAL_NAME:Administrador}
app.bootstrap.admin.email=${ADMIN_INITIAL_EMAIL:}
app.bootstrap.admin.password=${ADMIN_INITIAL_PASSWORD:}

# Endpoint público temporário para criar administradores durante o desenvolvimento.
app.test-admin.enabled=${TEST_ADMIN_ENDPOINT_ENABLED:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
